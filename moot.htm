<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar Animation</title>
    <link rel="stylesheet" href="loading.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <!-- Progress Bar Loading Page -->
    <div class="container">
        <div id="progressive">
            <h1 class="loadFont text-center">you are phsycopathic-ly a patient of The Imposter Syndrome <br> <br> Please Wait...</h1>

            </div>
        </div>
    </div>
    <script src="loading.js"></script>
</body>
</html>
